<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Basic AJAX Demo</title>
	<link rel="stylesheet" href="style.css">

</head>

<body>
	<!-- tutorial section that includes a form which after submission displays text from the response.html file by use of the GET Ajax request -->
	<div class='container' id="content">
		<h1>Sign up for our Newsletter</h1>
		<div class="display">
			<form>
				<input id="fullName" placeholder="Name">
				<input placeholder="Email">
				<!-- function getMsg is used to set up and send AJAX request -->
				<input type="button" class="btn" value="Submit" onclick="getMsg();" /> 
			</form>
		</div>
	</div>

	<!-- second container which should display content from another HTML file by sending AJAX request -->
	<div class='container' style="margin-bottom:30px;" id="replace">
		<h1>Click the button</h1>
		<div class="display">
			<!-- this button uses getNew function to sets up and send an AJAX request that is fetching content from content.html and is displayed after the button is clicked -->
			<input type="button" style="display:block; margin: 2 auto;" class="btn" value="Press" onclick="getNew();" />
		</div>
	</div>
	<!-- linked javascript file -->
	<script src="ajaxScript.js"></script>
</body>

</html>
